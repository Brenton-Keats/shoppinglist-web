name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        env:
          # PUBLIC_API_BASE_URL is the Lambda Function URL (Terraform output
          # `function_url`), stored as a GitHub Actions variable after the first
          # terraform apply. Replaces the former PUBLIC_APPS_SCRIPT_URL.
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          # Same shared key the Lambda validates (terraform.yml -> API_KEY secret).
          # Ignored by the app when PUBLIC_GOOGLE_CLIENT_ID is set.
          PUBLIC_API_KEY: ${{ secrets.API_KEY }}
          # Optional: enable Google sign-in (must match Terraform google_client_id).
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_APP_NAME: ${{ vars.PUBLIC_APP_NAME || 'Shopping List' }}
          PUBLIC_APP_VERSION: ${{ vars.PUBLIC_APP_VERSION || '1.0.0' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
