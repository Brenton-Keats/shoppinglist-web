name: Deploy to GitHub Pages

# Deploys the frontend to GitHub Pages. Triggers on:
#   * push to main — covers frontend-only changes (src/**, static/**, etc.) that
#     do NOT run Terraform, so the UI ships without an infra change.
#   * workflow_run after Terraform succeeds — covers infra changes, so a new
#     Lambda URL is picked up and the frontend is rebuilt against it.
#   * manual dispatch.
#
# In every case the Lambda Function URL is read from the latest successful
# Terraform run's `tf-outputs` artifact (see "Resolve Terraform run id"), so the
# API base URL is never stored as a variable and this workflow needs no AWS
# access.

on:
  push:
    branches: [main]
    # Frontend-only changes don't run Terraform, so deploy directly. Infra
    # changes (terraform/**, lambda/**) are excluded here and instead deploy via
    # the workflow_run trigger below, once Terraform has applied the new URL.
    paths-ignore:
      - 'terraform/**'
      - 'lambda/**'
      - '.github/workflows/terraform.yml'
  workflow_run:
    workflows: [Terraform]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download artifacts from the Terraform run
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Deploy on direct push and manual dispatch unconditionally; for
    # workflow_run (Terraform) events, only when that upstream run succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Resolve Terraform run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.workflow_run.id }}" ]; then
            id="${{ github.event.workflow_run.id }}"
          else
            id=$(gh run list --repo "${{ github.repository }}" --workflow Terraform \
              --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$id" ]; then
            echo "::error::No successful Terraform run found to source outputs from"
            exit 1
          fi
          echo "TF_RUN_ID=$id" >> "$GITHUB_ENV"

      - name: Download Terraform outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: tf-outputs
          run-id: ${{ env.TF_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Resolve API base URL from outputs
        run: |
          url=$(jq -r '.function_url.value' tf-outputs/tf-outputs.json)
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::error::function_url not found in Terraform outputs artifact"
            exit 1
          fi
          echo "PUBLIC_API_BASE_URL=$url" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Sourced from the Terraform outputs artifact (see steps above).
          PUBLIC_API_BASE_URL: ${{ env.PUBLIC_API_BASE_URL }}
          # Unused in Google-auth mode (empty); retained for the fallback path.
          PUBLIC_API_KEY: ${{ secrets.API_KEY }}
          # Same repository variable the Terraform workflow uses (GOOGLE_CLIENT_ID);
          # mapped here to the SvelteKit-required PUBLIC_ build env name.
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          PUBLIC_APP_NAME: ${{ vars.PUBLIC_APP_NAME || 'Shopping List' }}
          PUBLIC_APP_VERSION: ${{ vars.PUBLIC_APP_VERSION || '1.0.0' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
