name: Terraform

# Plans on PRs, applies on push to main. Authenticates to AWS via the GitHub
# OIDC role created by the bootstrap stack (no long-lived access keys).
#
# Required GitHub Actions configuration (Settings -> Secrets and variables):
#   Variables:
#     AWS_ROLE_ARN       ARN of the CI role   (bootstrap output ci_role_arn)
#     AWS_REGION         e.g. ap-southeast-2  (must match bootstrap)
#     TF_STATE_BUCKET    state bucket name    (bootstrap output state_bucket_name)
#     ALLOWED_ORIGINS    JSON array string, e.g. ["https://user.github.io","http://localhost:5173"]
#   Secrets:
#     API_KEY            shared API key the Lambda validates ("" for open access).
#                        The SAME secret is injected into the frontend build
#                        (deploy.yml -> PUBLIC_API_KEY) so client and server match.

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'lambda/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - 'lambda/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      # Terraform reads TF_VAR_* automatically.
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_api_key: ${{ secrets.API_KEY }}
      TF_VAR_allowed_origins: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lambda/package-lock.json

      - name: Build Lambda package
        working-directory: lambda
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false tfplan
