name: Terraform

# Deploys the backend into the Sandbox account using the landing-zone-provided
# GitHub OIDC CI roles. The identity model and full contract are documented by the
# landing zone in terraform/15-sandbox-ci/WORKLOAD-CI-ACCESS.md — not repeated here.
#
# This workflow consumes:
#   - plan role  via the `terraform-plan` environment  (PRs / manual dispatch)
#   - apply role via the `terraform-apply` environment (push to main)
#
# Required repo configuration:
#   Variables:    GOOGLE_CLIENT_ID (required); ALLOWED_EMAILS (optional JSON array —
#                 empty accepts any account the OAuth client authenticates)
#   Secret:       API_KEY (unused in Google-auth mode; may be "")
#   Environments: terraform-plan (no protection), terraform-apply (protect main + reviewer)
#
# ALLOWED_ORIGINS is derived from the repo owner (GitHub Pages origin). The apply
# job publishes terraform outputs as an artifact for the Pages workflow.

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'lambda/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - 'lambda/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  PLAN_ROLE: arn:aws:iam::132848804640:role/GitHubActionsTerraformPlan
  APPLY_ROLE: arn:aws:iam::132848804640:role/GitHubActionsTerraformApply
  # Terraform variable inputs (read automatically as TF_VAR_*).
  TF_VAR_aws_region: ap-southeast-2
  TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
  TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS }}
  TF_VAR_api_key: ${{ secrets.API_KEY }}

jobs:
  plan:
    # Runs on PRs and manual dispatch, via the terraform-plan environment.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: terraform-plan
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive allowed origins (GitHub Pages origin + local dev)
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "TF_VAR_allowed_origins=[\"https://${owner}.github.io\",\"http://localhost:5173\"]" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lambda/package-lock.json

      - name: Build Lambda package
        working-directory: lambda
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.PLAN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

  apply:
    # Runs on push to main, via the protected terraform-apply environment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: terraform-apply
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive allowed origins (GitHub Pages origin + local dev)
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "TF_VAR_allowed_origins=[\"https://${owner}.github.io\",\"http://localhost:5173\"]" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lambda/package-lock.json

      - name: Build Lambda package
        working-directory: lambda
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false tfplan

      - name: Export Terraform outputs
        run: terraform output -json > tf-outputs.json

      - name: Upload Terraform outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs
          path: terraform/tf-outputs.json
          retention-days: 7
